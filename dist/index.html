<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./public/img/favico.png" type="image/x-icon">
    <title>Validador de Expresiones Regulares</title>
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <h1 class="text-center text-primary mb-4">
                    Validador de Expresiones Regulares
                </h1>

                <div class="card shadow p-4">

                    <div class="mb-3">
                        <label for="expresion" class="form-label">
                            Expresión regular
                        </label>
                        <input type="text" id="expresion"
                            class="form-control"
                            placeholder="Ejemplo: ^[A-Z][a-z]+$">
                    </div>

                    <div class="mb-3">
                        <label for="texto" class="form-label">
                            Texto a validar
                        </label>
                        <input type="text" id="texto"
                            class="form-control"
                            placeholder="Escribe un texto">
                    </div>

                    <div class="d-flex gap-2">
                        <button id="comparar" class="btn btn-primary">
                            Comparar
                        </button>

                        <button id="limpiar" class="btn btn-secondary">
                            Limpiar
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="./bundle.js"></script>
</body>
</html>
